name: Android TV Build

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "native/**"
      - "scripts/**"
      - "build.py"
      - ".github/ci.prop"
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "app/**"
      - "native/**"
      - "scripts/**"
      - "build.py"
      - ".github/ci.prop"
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  tv-contract:
    name: Validate Android TV contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Validate TV-only UI contract
        shell: bash
        run: python .github/scripts/check_tv_ui.py

  build:
    name: Build arm64 Android TV artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: tv-contract
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          is-asset-build: true

      - name: Prepare CI build config
        shell: bash
        run: cp .github/ci.prop "$RUNNER_TEMP/ci-build.prop"

      - name: Configure custom JKS signing
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          TV_SIGNING_JKS_BASE64: ${{ secrets.TV_SIGNING_JKS_BASE64 }}
          TV_SIGNING_STORE_PASSWORD: ${{ secrets.TV_SIGNING_STORE_PASSWORD }}
          TV_SIGNING_KEY_ALIAS: ${{ secrets.TV_SIGNING_KEY_ALIAS }}
          TV_SIGNING_KEY_PASSWORD: ${{ secrets.TV_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          python .github/scripts/configure_signing.py \
            --config "$RUNNER_TEMP/ci-build.prop" \
            --keystore "$RUNNER_TEMP/magisk-tv-release.jks"

          if [[ -s "$RUNNER_TEMP/magisk-tv-release.jks" ]]; then
            keytool -list \
              -keystore "$RUNNER_TEMP/magisk-tv-release.jks" \
              -storepass "$TV_SIGNING_STORE_PASSWORD" \
              -alias "$TV_SIGNING_KEY_ALIAS" \
              >/dev/null

            {
              echo "### APK signing"
              echo
              echo "Custom JKS signing: **enabled**."
              echo "Both debug and release APKs will use the configured JKS."
              echo "The keystore and generated signing config are stored only in the runner temporary directory."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### APK signing"
              echo
              echo "Custom JKS signing secrets are not configured; debug and release APKs use the project's default debug signing key."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Note PR signing policy
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          {
            echo "### APK signing"
            echo
            echo "Pull request builds intentionally do not receive custom JKS signing secrets."
            echo "Debug and release APKs use the project's default debug signing key."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build arm64 debug artifacts
        run: python build.py -v -c "$RUNNER_TEMP/ci-build.prop" all

      - name: Build arm64 release native binaries
        run: python build.py -v -r -c "$RUNNER_TEMP/ci-build.prop" native

      - name: Build arm64 release APK
        run: python build.py -v -r -c "$RUNNER_TEMP/ci-build.prop" app

      - name: Verify APK variants
        shell: bash
        run: |
          set -euo pipefail
          required=(
            out/app-debug.apk
            out/stub-debug.apk
            out/app-release.apk
            out/stub-release.apk
          )
          for file in "${required[@]}"; do
            [[ -s "$file" ]] || { echo "Missing expected APK: $file" >&2; exit 1; }
          done
          ls -lh out/*.apk
          {
            echo "### APK variants"
            echo
            echo "Artifact contains:"
            echo "- app-debug.apk"
            echo "- stub-debug.apk"
            echo "- app-release.apk"
            echo "- stub-release.apk"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing material
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/magisk-tv-release.jks" \
            "$RUNNER_TEMP/ci-build.prop"

      - name: Stop Gradle daemon
        if: ${{ always() }}
        shell: bash
        run: ./scripts/env.py ./app/gradlew --stop

      - name: Upload build artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: magisk-tv-arm64-${{ github.sha }}
          path: out
          if-no-files-found: error
          compression-level: 9
          retention-days: 14

  test:
    name: Run repository tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: tv-contract
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Run tests
        run: python build.py -v -c .github/ci.prop test

      - name: Stop Gradle daemon
        if: ${{ always() }}
        shell: bash
        run: ./scripts/env.py ./app/gradlew --stop

  ci-success:
    name: Android TV CI
    runs-on: ubuntu-24.04
    if: ${{ always() }}
    needs:
      - tv-contract
      - build
      - test
    steps:
      - name: Verify required jobs
        shell: bash
        env:
          TV_CONTRACT_RESULT: ${{ needs.tv-contract.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          printf 'TV contract: %s\n' "$TV_CONTRACT_RESULT"
          printf 'Build:       %s\n' "$BUILD_RESULT"
          printf 'Tests:       %s\n' "$TEST_RESULT"
          test "$TV_CONTRACT_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$TEST_RESULT" = success
