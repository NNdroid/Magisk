name: Android TV Build

on:
  push:
    branches:
      - "**"
    paths:
      - "app/**"
      - "native/**"
      - "scripts/**"
      - "build.py"
      - ".github/ci.prop"
      - ".github/actions/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "app/**"
      - "native/**"
      - "scripts/**"
      - "build.py"
      - ".github/ci.prop"
      - ".github/actions/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  tv-contract:
    name: Validate Android TV contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Validate TV-only UI contract
        shell: bash
        run: python .github/scripts/check_tv_ui.py

  build:
    name: Build arm64 Android TV artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: tv-contract
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          is-asset-build: true

      - name: Build arm64 artifacts
        run: python build.py -v -c .github/ci.prop all

      - name: Stop Gradle daemon
        if: ${{ always() }}
        shell: bash
        run: ./scripts/env.py ./app/gradlew --stop

      - name: Upload build artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: magisk-tv-arm64-${{ github.sha }}
          path: out
          if-no-files-found: error
          compression-level: 9
          retention-days: 14

  test:
    name: Run repository tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: tv-contract
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Run tests
        run: python build.py -v test

      - name: Stop Gradle daemon
        if: ${{ always() }}
        shell: bash
        run: ./scripts/env.py ./app/gradlew --stop

  ci-success:
    name: Android TV CI
    runs-on: ubuntu-24.04
    if: ${{ always() }}
    needs:
      - tv-contract
      - build
      - test
    steps:
      - name: Verify required jobs
        shell: bash
        env:
          TV_CONTRACT_RESULT: ${{ needs.tv-contract.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          printf 'TV contract: %s\n' "$TV_CONTRACT_RESULT"
          printf 'Build:       %s\n' "$BUILD_RESULT"
          printf 'Tests:       %s\n' "$TEST_RESULT"
          test "$TV_CONTRACT_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$TEST_RESULT" = success
